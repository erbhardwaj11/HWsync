name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.0.2)'
        required: true
        default: 'v0.0.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.version }}"
            echo "VERSION=${INPUT_TAG#v}" >> $GITHUB_OUTPUT
            echo "TAG=${INPUT_TAG}" >> $GITHUB_OUTPUT
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            echo "VERSION=${RAW_TAG#v}" >> $GITHUB_OUTPUT
            echo "TAG=${RAW_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, json, curl

      - name: Run Test Suite
        run: |
          php tests/test_hwsync_pipeline.php

      - name: Package WordPress Plugin
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          PKG_NAME="hwsync-${TAG}.zip"
          
          # Create staging folder for clean WordPress plugin packaging
          mkdir -p build/hwsync
          
          # Copy production files
          cp -r admin includes public templates hwsync.php README.md build/hwsync/
          if [ -d "languages" ]; then
            cp -r languages build/hwsync/
          fi
          
          cd build
          zip -r "../${PKG_NAME}" hwsync/
          zip -r "../hwsync.zip" hwsync/
          cd ..
          
          echo "PACKAGE_PATH=${PKG_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.TAG }}
          body: |
            ## HWsync Release ${{ steps.get_version.outputs.TAG }}
            
            ### Features & Capabilities:
            - **Native PCSpecs Theme Database Sync**: Directly synchronizes canonical components, specs JSON, and multi-vendor pricing matrices into `wp_pc_components` and `wp_pc_vendor_prices` (powering the Headless React PC Part-Picker SPA & REST API `/wp-json/pc-builder/v1/components`).
            - **Clean Admin Experience**: Completely eliminated redundant CPT post clutter from WordPress Admin sidebar.
            - **Multi-Vendor Retailer Scrapers**: Real-time integration with MDComputers, Vedant Computers, PrimeABGB, EliteHubs, and PCStudio with in-browser headless and cURL adapters.
            - **Intelligent Component Matching Engine**: Multi-stage fuzzy matching, MPN detection, and automatic brand/model normalization.
            - **Detailed Specifications Scraper**: On-demand specs extraction from retailer product pages.
            - **Interactive Price Comparison**: Standalone shortcode `[hwsync_price_table]` with live affiliate buy buttons.
            - **Maintenance & Disaster Recovery**: Full database CSV Export, Restore, and Reset utilities.
            
            ### Installation:
            1. Download `hwsync-${{ steps.get_version.outputs.TAG }}.zip` or `hwsync.zip` below.
            2. In WordPress Admin, navigate to **Plugins > Add New > Upload Plugin**.
            3. Upload the zip file, activate it, and manage your sync catalog under **HWsync > Dashboard**.
          files: |
            ${{ env.PACKAGE_PATH }}
            hwsync.zip
          draft: false
          prerelease: false
          make_latest: true

