<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="24" fill="#0c1322"/>
  <rect x="25" y="25" width="150" height="150" rx="10" fill="#131e36" stroke="#00f2fe" stroke-width="2.5"/>
  <!-- CPU Socket -->
  <rect x="45" y="45" width="50" height="50" rx="6" fill="#1c2b4c" stroke="#38bdf8" stroke-width="2"/>
  <rect x="55" y="55" width="30" height="30" rx="4" fill="#0c1322" stroke="#00f2fe" stroke-width="1.5"/>
  <!-- RAM Slots -->
  <rect x="115" y="42" width="8" height="60" rx="2" fill="#00f2fe"/>
  <rect x="128" y="42" width="8" height="60" rx="2" fill="#38bdf8"/>
  <rect x="141" y="42" width="8" height="60" rx="2" fill="#00f2fe"/>
  <rect x="154" y="42" width="8" height="60" rx="2" fill="#38bdf8"/>
  <!-- PCIe Slots -->
  <rect x="45" y="115" width="115" height="10" rx="2" fill="#38bdf8"/>
  <rect x="45" y="135" width="80" height="8" rx="2" fill="#1c2b4c" stroke="#00f2fe" stroke-width="1.5"/>
  <rect x="45" y="152" width="115" height="10" rx="2" fill="#38bdf8"/>
  <!-- I/O Ports Block -->
  <rect x="25" y="40" width="12" height="40" fill="#00f2fe" opacity="0.8"/>
  <!-- Chipset Heatsink -->
  <rect x="125" y="125" width="35" height="35" rx="4" fill="#1c2b4c" stroke="#00f2fe" stroke-width="2"/>
</svg>